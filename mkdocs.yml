# ==========================================================================
# ResearchReport 站点配置（MkDocs Material）
#
# 站点是仓库 Markdown 的「只读渲染层」：不产生第二套内容源。
# nav 区块由 scripts/library_index.py 生成（见下方 SCRIPT:nav 标记），
# 标记之间的内容请勿手改；其余配置项可手改。
# 构建：pip install "mkdocs-material==9.7.7" && mkdocs build --strict
# 预览：mkdocs serve
# ==========================================================================

site_name: ResearchReport 研究图书馆
site_description: 一个仓库收敛 AIGC / LLM / 论文深读全部研究产出
site_url: https://zhoucanzong.github.io/ResearchReport/
repo_url: https://github.com/zhoucanzong/ResearchReport
repo_name: zhoucanzong/ResearchReport
edit_uri: "" # 条目是研究产出，站点不提供「编辑此页」

# docs_dir 指向 staging 镜像（由 scripts/library_index.py 生成，逐字节镜像仓库内容）
# —— MkDocs 不允许 docs_dir 与配置文件同目录，staging 同时让「渲染什么」完全可控。
# 现有 docs/ 目录是内容（会被镜像进 staging），站点不动它。
docs_dir: site-docs
site_dir: site
use_directory_urls: true

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: zh
  font: false # 不拉 Google Fonts：系统字体栈（见 assets/site.css），国内访问更稳
  icon:
    logo: material/bookshelf
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: en
      # 中文搜索：把每个 CJK 字切成独立 token（零宽断言），查询「注意力」= 注+意+力 全命中
      separator: '[\s\-\.,:;!?()\[\]{}/"''«»“”‘’、。，；：！？（）【】《》〈〉]+|(?=[一-鿿])'

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: ¶
      toc_depth: 3

# extra_css 会被 staging 镜像进 site-docs/assets/
extra_css:
  - assets/site.css

validation:
  # 未进 nav 的页面（子文档、根 README）仍然构建、可访问，仅记 info —— 让 --strict 聚焦真正的坏链
  omitted_files: info

